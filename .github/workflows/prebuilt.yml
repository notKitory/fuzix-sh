name: Build prebuilt runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-amd64
            os: linux
            runner: ubuntu-24.04
          - arch: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
          - arch: darwin-arm64
            os: macos
            runner: macos-latest

    env:
      FUZIX_REF: v0.4
      FUZIX_REPO: https://github.com/EtchedPixels/FUZIX.git
      FUZIX_BINTOOLS_REPO: https://github.com/EtchedPixels/Fuzix-Bintools.git
      FUZIX_FCC_REPO: https://github.com/EtchedPixels/Fuzix-Compiler-Kit.git
      Z80PACK_REPO: https://github.com/udo-munk/z80pack.git
      FUZIX_IMAGE_BASE: https://fuzix.org/downloads/0.4/z80pack

    steps:
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            automake \
            byacc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            gputils \
            libboost-dev \
            libboost-program-options-dev \
            libbsd-dev \
            libjpeg-dev \
            make \
            perl \
            pkg-config \
            tcl \
            texinfo \
            zlib1g-dev
          sudo update-alternatives --set yacc /usr/bin/byacc || true

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install byacc bison flex gputils make pkg-config || true

      - name: Configure environment PATH
        run: |
          sudo mkdir -p /opt/fcc/bin
          sudo chown -R "$USER" /opt/fcc
          echo "/opt/fcc/bin" >> $GITHUB_PATH
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
            echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
            echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
            echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH
            echo "/usr/local/opt/bison/bin" >> $GITHUB_PATH
            echo "/usr/local/opt/flex/bin" >> $GITHUB_PATH
            printf '#!/bin/sh\nif [ "$#" -le 2 ]; then\n  case "$1" in\n    cq|cr|r|q) exit 0 ;;\n  esac\nfi\nexec /usr/bin/ar "$@"\n' > /opt/fcc/bin/ar
            chmod +x /opt/fcc/bin/ar
          fi

      - name: Build toolchain
        run: |
          set -eux
          root="$PWD/work"
          mkdir -p "$root/src"
          sudo mkdir -p /opt/fcc
          sudo chown -R "$USER" /opt/fcc

          git clone --depth 1 "$FUZIX_BINTOOLS_REPO" "$root/src/Fuzix-Bintools"
          make -C "$root/src/Fuzix-Bintools" install

          git clone --depth 1 "$FUZIX_FCC_REPO" "$root/src/Fuzix-Compiler-Kit"
          if [ "$(uname -s)" = "Darwin" ]; then
            find "$root/src/Fuzix-Compiler-Kit" -name Makefile -exec sed -i.bak 's/-lbsd//g' {} +
          fi
          make -C "$root/src/Fuzix-Compiler-Kit" bootstuff
          make -C "$root/src/Fuzix-Compiler-Kit" install
          ln -sf fcc /opt/fcc/bin/cc85

      - name: Build FUZIX runtime files
        run: |
          set -eux
          root="$PWD/work"
          export PATH="/opt/fcc/bin:$PATH"

          if ! git clone --depth 1 --branch "$FUZIX_REF" "$FUZIX_REPO" "$root/src/FUZIX"; then
            alt_ref="${FUZIX_REF#v}"
            git clone --depth 1 --branch "$alt_ref" "$FUZIX_REPO" "$root/src/FUZIX"
          fi

          mkdir -p "$root/downloads/z80pack"
          curl -fL --retry 3 -o "$root/downloads/z80pack/boot.dsk" "$FUZIX_IMAGE_BASE/boot.dsk"
          curl -fL --retry 3 -o "$root/downloads/z80pack/hd-fuzix.dsk" "$FUZIX_IMAGE_BASE/hd-fuzix.dsk"

          make -C "$root/src/FUZIX/Standalone" ucp
          make -C "$root/src/FUZIX/Library" tools/binman85 tools/liberror tools/syscall_8080
          make -C "$root/src/FUZIX/Library/libs" -f Makefile.8080

      - name: Build z80pack runtime files
        run: |
          set -eux
          root="$PWD/work"

          git clone --depth 1 "$Z80PACK_REPO" "$root/src/z80pack"
          if [ -d "$root/src/z80pack/cpmsim/srcsim" ]; then
            (
              cd "$root/src/z80pack/cpmsim/srcsim"
              make || make -f Makefile.linux || make -f Makefile.linuxc
            )
          fi
          if [ ! -x "$root/src/z80pack/cpmsim/cpmsim" ]; then
            make -C "$root/src/z80pack"
          fi
          make -C "$root/src/z80pack/cpmsim/srctools"

      - name: Build EmulatorKit and Virtual68 runtime files
        run: |
          set -eux
          root="$PWD/work"

          git clone --depth 1 https://github.com/EtchedPixels/Virtual68.git "$root/src/Virtual68"
          make -C "$root/src/Virtual68"
          if [ -x "$root/src/Virtual68/makeprom" ]; then
            ( cd "$root/src/Virtual68" && ./makeprom )
          fi

          git clone --depth 1 https://codeberg.org/EtchedPixels/EmulatorKit.git "$root/src/EmulatorKit"
          make -C "$root/src/EmulatorKit" tiny68k || true

      - name: Package release assets
        run: |
          set -eux
          root="$PWD/work"
          pkg="$PWD/pkg"
          dist="$PWD/dist"
          arch="${{ matrix.arch }}"

          rm -rf "$pkg" "$dist"
          mkdir -p "$pkg/toolchain" \
            "$pkg/fuzix/include" \
            "$pkg/fuzix/libs" \
            "$pkg/fuzix/tools" \
            "$pkg/fuzix/images" \
            "$pkg/z80pack/srctools" \
            "$pkg/z80pack/conf" \
            "$pkg/z80pack/disks" \
            "$pkg/emulatorkit" \
            "$dist"

          cp -a /opt/fcc/. "$pkg/toolchain/"
          cp -a "$root/src/FUZIX/Library/include/." "$pkg/fuzix/include/"
          cp "$root/src/FUZIX/Library/libs"/*.a "$pkg/fuzix/libs/"
          cp "$root/src/FUZIX/Library/libs"/*.o "$pkg/fuzix/libs/"
          cp "$root/src/FUZIX/Library/tools/binman85" "$pkg/fuzix/tools/binman85"
          cp "$root/src/FUZIX/Standalone/ucp" "$pkg/fuzix/ucp"
          cp "$root/downloads/z80pack/boot.dsk" "$pkg/fuzix/images/boot.dsk"
          cp "$root/downloads/z80pack/hd-fuzix.dsk" "$pkg/fuzix/images/hd-fuzix.dsk"

          cp "$root/src/z80pack/cpmsim/cpmsim" "$pkg/z80pack/cpmsim"
          cp -a "$root/src/z80pack/cpmsim/conf/." "$pkg/z80pack/conf/"
          for tool in cpmrecv cpmsend ptp2bin mkdskimg bin2hex cpmr.sh cpmw.sh; do
            if [ -x "$root/src/z80pack/cpmsim/srctools/$tool" ]; then
              cp "$root/src/z80pack/cpmsim/srctools/$tool" "$pkg/z80pack/srctools/"
            fi
          done

          if [ -x "$root/src/Virtual68/v68" ]; then
            cp "$root/src/Virtual68/v68" "$pkg/emulatorkit/v68"
          fi
          if [ -f "$root/src/Virtual68/boot.dat" ]; then
            cp "$root/src/Virtual68/boot.dat" "$pkg/emulatorkit/boot.dat"
          fi
          if [ -x "$root/src/EmulatorKit/tiny68k" ]; then
            cp "$root/src/EmulatorKit/tiny68k" "$pkg/emulatorkit/tiny68k"
          fi

          test -x "$pkg/toolchain/bin/fcc"
          test -x "$pkg/toolchain/bin/asz80"
          test -x "$pkg/toolchain/bin/ldz80"
          test -f "$pkg/fuzix/include/stdio.h"
          test -d "$pkg/fuzix/include/8080"
          test -f "$pkg/fuzix/libs/crt0_8080.o"
          test -f "$pkg/fuzix/libs/libc8080.a"
          test -x "$pkg/fuzix/tools/binman85"
          test -x "$pkg/fuzix/ucp"
          test -s "$pkg/fuzix/images/boot.dsk"
          test -s "$pkg/fuzix/images/hd-fuzix.dsk"
          test -x "$pkg/z80pack/cpmsim"
          test -d "$pkg/z80pack/srctools"
          test -x "$pkg/emulatorkit/v68"

          tar -C "$pkg/toolchain" -czf "$dist/fuzix-toolchain-$arch.tar.gz" .
          tar -C "$pkg/fuzix" -czf "$dist/fuzix-runtime-$arch.tar.gz" .
          tar -C "$pkg/z80pack" -czf "$dist/z80pack-runtime-$arch.tar.gz" .
          tar -C "$pkg/emulatorkit" -czf "$dist/emulatorkit-runtime-$arch.tar.gz" .

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish latest prebuilt release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-latest
          name: Latest prebuilt runtime
          make_latest: true
          overwrite_files: true
          files: dist/*.tar.gz
